services:
  bookgloss:
    build: .
    container_name: bookgloss
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/app/data/vocabulary.db
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      GOOGLE_CLOUD_CREDENTIALS_BASE64: ${GOOGLE_CLOUD_CREDENTIALS_BASE64:-}
    volumes:
      - bookgloss-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  bookgloss-data:
